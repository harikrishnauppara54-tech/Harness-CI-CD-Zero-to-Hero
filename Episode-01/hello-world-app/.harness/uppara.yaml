pipeline:
  name: uppara
  identifier: uppara
  projectIdentifier: HarnessCICDZerotoHero
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: git
        build: <+input>
  stages:
    - stage:
        name: dev
        identifier: dev
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Run_1
                  identifier: Run_1
                  spec:
                    shell: Sh
                    command: |-
                      set -e

                      echo "Checking Java and Maven"
                      java -version
                      mvn -version

                      echo "Checking source files"
                      pwd
                      ls -la

                      echo "Building Java Application"
                      mvn -B clean package

                      echo "Build Completed"
